name: one-year-ago

# 「1年前の今日」プレイリストを日替わりで入れ替える（one_year_ago.py）。
#
# 主な起動: Vercel Cron（0:00〜0:59 JST のどこか）→ site/api/cron/one-year-ago.ts → workflow_dispatch。
#   GitHub の定期実行はこのリポジトリの実測で数時間遅れ・大半の間引きがあり、0時の更新には
#   使えない。手動実行（workflow_dispatch）は数秒で起動するので、きっかけだけ外から与える。
# 保険: 下の schedule。Vercel 側が止まっても（トークン期限切れ・Cron の取りこぼし）その日のうちには
#   更新されるように残す。同じ日に何回動いても中身は同じ（冪等）なので二重に動いても害はない。
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'   # 00:23 JST。混雑する毎時0分を外す（実際は遅れて動く前提の保険）

permissions:
  contents: read   # data ブランチを読むだけ。リポジトリには何も書かない

concurrency:
  group: one-year-ago   # 管理プレイリストには触れないので nightly（spotify-serial）とは直列化しない
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
  SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
  SPOTIPY_REDIRECT_URI: 'http://127.0.0.1:8000/callback'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # 再生記録（拡張履歴・scrobble・自前ログ）と、scrobble を Spotify の曲に解決する索引
      - uses: actions/checkout@v5
        with:
          ref: data
          path: _data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Spotify token cache
        run: printf '%s' "$SPOTIFY_TOKEN_CACHE" > .cache-spotify
        env:
          SPOTIFY_TOKEN_CACHE: ${{ secrets.SPOTIFY_TOKEN_CACHE }}

      - name: Update the playlist
        run: python one_year_ago.py --data-dir _data/data
