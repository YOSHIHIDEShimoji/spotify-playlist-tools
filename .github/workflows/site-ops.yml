name: site-ops

# サイト発の操作（dashboard-design §7）。ブラウザから fine-grained PAT で
# workflow_dispatch され、siteops.py が Spotify を変更する。手動 dispatch のみ・自動実行しない。

on:
  workflow_dispatch:
    inputs:
      op:
        description: '操作'
        type: choice
        required: true
        options:
          - dedupe-apply
          - classify-apply
          - keep-apply
          - undo
      payload:
        description: 'JSON 文字列（サイトが生成）'
        type: string
        required: true

permissions:
  contents: write   # 状態ファイル(main)・data ブランチへのコミット

concurrency:
  group: spotify-serial   # nightly とプレイリスト変更を直列化
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
  SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
  SPOTIPY_REDIRECT_URI: 'http://127.0.0.1:8000/callback'

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: data
          path: _data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Spotify token cache
        run: printf '%s' "$SPOTIFY_TOKEN_CACHE" > .cache-spotify
        env:
          SPOTIFY_TOKEN_CACHE: ${{ secrets.SPOTIFY_TOKEN_CACHE }}

      - name: Run operation
        run: python siteops.py --op "${{ inputs.op }}" --payload "$PAYLOAD" --data-dir _data/data
        env:
          PAYLOAD: ${{ inputs.payload }}

      - name: Commit cache/state (main)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist_class_cache.json
          if git diff --cached --quiet; then
            echo "main 側に変更なし"
          else
            git commit -m "auto: サイト操作による分類キャッシュ更新"
            git push
          fi

      - name: Push dashboard data
        if: always()
        working-directory: _data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "data ブランチに変更なし"
            exit 0
          fi
          git commit -m "data: サイト操作（${{ inputs.op }}）"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 競合。rebase して再試行 ($i/3)"
            git pull --rebase origin data
          done
          echo "::error::data ブランチへの push が3回失敗しました"
          exit 1

      - name: Trigger Vercel rebuild
        if: always()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK 未設定のため再ビルドをスキップ"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "Vercel 再ビルドを起動しました"

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(printf 'サイト操作 %s が失敗しました。\n\n実行: %s\n\n検証エラー（payload と現在のデータの不一致）の可能性があります。サイトを再読み込みしてから再操作してください。' "${{ inputs.op }}" "$run_url")"
          gh issue create --title "サイト操作が失敗した (${{ inputs.op }})" --label nightly-failure --body "$body" || true
